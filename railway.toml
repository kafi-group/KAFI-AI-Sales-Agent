[build]
builder = "NIXPACKS"
buildCommand = "cd backend && pip install -r requirements.txt"
watchPatterns = ["backend/**"]

[deploy]
startCommand = "cd backend && python -c \"from db.migrate import run_migrations; run_migrations()\" && KAFI_SKIP_LIFESPAN_MIGRATE=1 uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
