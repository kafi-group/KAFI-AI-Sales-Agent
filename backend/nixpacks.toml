# Railway all-in-one: build Vite frontend into backend/static when the full repo
# is available (Git deploy). CLI uploads can ship pre-built backend/static instead.

[phases.setup]
nixPkgs = ["nodejs_20", "python311"]

[phases.install]
dependsOn = ["setup"]
cmds = [
  "pip install -r requirements.txt",
  "if [ -d ../frontend ]; then cd ../frontend && npm ci; fi",
]

[phases.build]
dependsOn = ["install"]
cmds = [
  "if [ -f ../frontend/package.json ]; then cd ../frontend && npm run build && rm -rf ../backend/static && mkdir -p ../backend/static && cp -r dist/* ../backend/static/; elif [ ! -f static/index.html ]; then echo 'Missing frontend source and backend/static/index.html' && exit 1; else echo 'Using pre-built backend/static'; fi",
]

[start]
cmd = "python -c \"from db.migrate import run_migrations; run_migrations()\" && KAFI_SKIP_LIFESPAN_MIGRATE=1 uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1"
