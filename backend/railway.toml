[build]
builder = "nixpacks"
# Full repo is cloned; service root is backend/ so ../frontend is available at build time.
watchPatterns = ["backend/**", "frontend/**"]

[deploy]
# Use start.sh: migrate with 45s cap, then always boot uvicorn (avoids Railway 502).
startCommand = "sh start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
